name: CI Verify

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atheel_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atheel_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/atheel_ci?schema=public
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      STRICT_PERSISTENCE: true
      ALLOW_IN_MEMORY_FALLBACK: false
      AUTH_JWT_SECRET: ci_test_secret_change_me
      AUTH_REFRESH_PEPPER: ci_refresh_pepper
      WORKER_TOKEN: ci_worker_token
      EXPORTS_RENDERER_TOKEN: ci_renderer_token
      QUEUE_MODE: redis
      EXPERIENCE_TWIN_SYNC_WORKER_ENABLED: false
      CI_RELEASE_CHANNEL: ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: pnpm db:generate

      - name: Prisma migrate deploy
        run: pnpm --filter @madar/db prisma:migrate:deploy

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Closure audits
        run: pnpm closure:generate

      - name: API e2e smoke
        run: pnpm --filter @madar/api test:smoke

      - name: Upload closure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: closure-artifacts
          path: |
            docs/closure
            .artifacts/closure
