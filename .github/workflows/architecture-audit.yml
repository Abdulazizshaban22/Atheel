name: Architecture Audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'scripts/audit/module-boundaries.mjs'
      - 'docs/architecture/**'
      - 'docs/engineering/**'
      - '.github/workflows/architecture-audit.yml'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  architecture-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Run architecture audit
        run: pnpm audit:module-boundaries

      - name: Upload architecture artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: architecture-audit-artifacts
          path: |
            docs/closure/MODULE_BOUNDARY_AUDIT.md
            .artifacts/architecture/module-boundary-audit.json
