name: Release Gate

on:
  workflow_dispatch:
    inputs:
      release_channel:
        description: Release channel to validate
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

jobs:
  release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI_RELEASE_CHANNEL: ${{ inputs.release_channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Release gate
        run: pnpm release:gate

      - name: Upload release gate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-artifacts-${{ inputs.release_channel }}
          path: |
            docs/closure/MIGRATION_CLOSURE_READINESS.md
            docs/closure/PLACEHOLDER_MIGRATIONS.md
            .artifacts/closure
