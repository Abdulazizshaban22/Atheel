# Atheel Platform — Production Docker Compose
# Wave123: Full production deployment stack
# Usage: docker compose -f infra/docker-compose.prod.yml up -d

version: '3.9'

x-common-env: &common-env
  NODE_ENV: production
  STRICT_PERSISTENCE: "true"
  ALLOW_IN_MEMORY_FALLBACK: "false"
  ALLOW_DEMO_SEED: "false"

services:
  # ═══════════════════════════════════════
  # Infrastructure
  # ═══════════════════════════════════════
  
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: atheel
      POSTGRES_USER: atheel
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    ports: ['5432:5432']
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U atheel -d atheel']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    secrets:
      - db_password
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ['6379:6379']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - backend

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: unless-stopped
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: atheel
      RABBITMQ_DEFAULT_PASS_FILE: /run/secrets/rmq_password
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    secrets:
      - rmq_password
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - backend

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      MINIO_ROOT_USER: atheel
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/minio_password
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 10s
      retries: 5
    secrets:
      - minio_password
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    networks:
      - backend

  createbuckets:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 atheel $$(cat /run/secrets/minio_password);
      mc mb -p local/atheel || true;
      mc mb -p local/atheel-exports || true;
      exit 0;
      "
    secrets:
      - minio_password
    networks:
      - backend

  # ═══════════════════════════════════════
  # Application Services
  # ═══════════════════════════════════════

  api:
    build:
      context: ../
      dockerfile: apps/api/Dockerfile
      args:
        NODE_ENV: production
    restart: unless-stopped
    ports: ['3001:3001']
    environment:
      <<: *common-env
      PORT: "3001"
      API_PREFIX: /api
      DATABASE_URL_FILE: /run/secrets/database_url
      AUTH_JWT_SECRET_FILE: /run/secrets/jwt_secret
      AUTH_REFRESH_PEPPER_FILE: /run/secrets/refresh_pepper
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.atheel.sa}
      TRUST_PROXY: "1"
      ENABLE_HSTS: "true"
      COOKIE_SECURE: "true"
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-.atheel.sa}
      MIGRATE_ON_START: "true"
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: atheel-api
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4318}
      OBJECT_STORE_PROVIDER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: atheel
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/minio_password
      S3_BUCKET: atheel
      S3_FORCE_PATH_STYLE: "1"
      EXPORTS_RENDERER_URL: http://exports-svc:3101
      EXPORTS_RENDERER_CHANNEL: http
      EXPORTS_RENDERER_TOKEN_FILE: /run/secrets/renderer_token
      WORKER_TOKEN_FILE: /run/secrets/worker_token
      VLLM_BASE_URL: ${VLLM_BASE_URL:-}
      VLLM_MODEL_NAME: ${VLLM_MODEL_NAME:-}
      RAG_PGVECTOR_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3001/api/health']
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 45s
    secrets:
      - database_url
      - jwt_secret
      - refresh_pepper
      - worker_token
      - renderer_token
      - minio_password
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '2.0'
      replicas: ${API_REPLICAS:-2}
    networks:
      - backend
      - frontend

  web:
    build:
      context: ../
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL:-https://api.atheel.sa}
    restart: unless-stopped
    ports: ['3000:3000']
    environment:
      NODE_ENV: production
      AUTH_JWT_SECRET_FILE: /run/secrets/jwt_secret
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3000/']
      interval: 15s
      timeout: 10s
      retries: 3
    secrets:
      - jwt_secret
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    networks:
      - frontend

  worker:
    build:
      context: ../
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    environment:
      <<: *common-env
      REDIS_URL: redis://redis:6379
      API_BASE_URL: http://api:3001
      API_PREFIX: /api
      WORKER_TOKEN_FILE: /run/secrets/worker_token
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
      OTEL_SERVICE_NAME: atheel-worker
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_ENDPOINT:-http://otel-collector:4318}
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'node -e "process.exit(0)"']
      interval: 30s
      timeout: 10s
      retries: 3
    secrets:
      - worker_token
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    networks:
      - backend

  exports-svc:
    build:
      context: ../
      dockerfile: apps/exports-svc/Dockerfile
    restart: unless-stopped
    ports: ['3101:3101']
    environment:
      <<: *common-env
      PORT: "3101"
      EXPORTS_RENDERER_TOKEN_FILE: /run/secrets/renderer_token
      OBJECT_STORE_PROVIDER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: atheel
      S3_SECRET_ACCESS_KEY_FILE: /run/secrets/minio_password
      S3_BUCKET: atheel-exports
      S3_FORCE_PATH_STYLE: "1"
    depends_on:
      minio:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3101/health']
      interval: 15s
      timeout: 10s
      retries: 3
    secrets:
      - renderer_token
      - minio_password
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'
    networks:
      - backend

# ═══════════════════════════════════════
# Secrets (Docker Secrets)
# ═══════════════════════════════════════
secrets:
  db_password:
    file: ../secrets/db_password.txt
  database_url:
    file: ../secrets/database_url.txt
  jwt_secret:
    file: ../secrets/jwt_secret.txt
  refresh_pepper:
    file: ../secrets/refresh_pepper.txt
  worker_token:
    file: ../secrets/worker_token.txt
  renderer_token:
    file: ../secrets/renderer_token.txt
  minio_password:
    file: ../secrets/minio_password.txt
  rmq_password:
    file: ../secrets/rmq_password.txt

# ═══════════════════════════════════════
# Volumes
# ═══════════════════════════════════════
volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local
  minio_data:
    driver: local

# ═══════════════════════════════════════
# Networks
# ═══════════════════════════════════════
networks:
  backend:
    driver: bridge
  frontend:
    driver: bridge
